name: PaperForge Enhanced CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  lint-and-typecheck:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  backend-unit-and-integration:
    name: Backend Build & JaCoCo Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and run test suite with JaCoCo
        run: mvn clean verify --batch-mode

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

  frontend-unit-tests:
    name: Frontend Vitest Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm run test

      - name: Build frontend production assets
        run: npm run build

  docker-build-and-scan:
    name: Docker Build & Trivy Vulnerability Scan
    needs: [lint-and-typecheck, backend-unit-and-integration, frontend-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PaperForge Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: paperforge/paperforge-ci:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paperforge/paperforge-ci:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  e2e-playwright-tests:
    name: E2E Playwright Browser Tests
    needs: [docker-build-and-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start PaperForge Services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for PaperForge backend service health..."
          until curl -s http://localhost:8080/api/v1/health | grep -q "UP"; do
            sleep 2
          done
          echo "PaperForge services online!"

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        run: |
          cd frontend
          npx playwright test
